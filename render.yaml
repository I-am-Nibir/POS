# Development/test-er jonno free plan. Ashol dokan chalur age duitai paid plan korun:
# free PostgreSQL-er meyad shimito ebong backup nei.
databases:
  - name: dokan-pos-db
    plan: free
services:
  - type: web
    name: pos-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dokan-pos-db
          property: connectionString
      - key: HTTPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_KEY
        sync: false
