services:
  - type: web
    name: pos-app
    runtime: node
    plan: starter            # SQLite data rakhar jonno persistent disk lagbe, free plan-e disk nei
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: pos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_FILE
        value: /var/data/pos.db
      - key: HTTPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
