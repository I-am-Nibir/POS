services:
  - type: web
    name: pos-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_FILE
        value: ./pos.db
      - key: HTTPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: SHOP_NAME
        sync: false
